<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patel's Cafe | Scan for Menu</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap');

    :root {
      --primary-color: #7B1113; /* Patel's Maroon */
      --secondary-color: #E2AC4C; /* Gold */
      --bg-color: #FFFDF7;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    .qr-card {
      background: white;
      width: 100%;
      max-width: 450px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
      border: 1px solid rgba(0,0,0,0.05);
      position: relative;
    }

    .qr-header {
      background: linear-gradient(135deg, var(--primary-color), #5A0C0E);
      padding: 40px 20px;
      color: white;
      position: relative;
    }

    .qr-header::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 0;
      width: 100%;
      height: 40px;
      background: white;
      border-radius: 50% 50% 0 0;
    }

    .qr-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      color: var(--secondary-color);
      margin-bottom: 5px;
      letter-spacing: 1px;
    }

    .qr-header p {
      font-size: 1.1rem;
      opacity: 0.9;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .qr-body {
      padding: 30px 40px 50px;
    }

    .instruction {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-bottom: 25px;
    }

    .qr-code-wrapper {
      background: white;
      padding: 15px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 10px 30px rgba(123, 17, 19, 0.15);
      border: 2px solid rgba(226, 172, 76, 0.3);
      margin-bottom: 30px;
    }

    .qr-code-wrapper img {
      width: 250px;
      height: 250px;
      display: block;
      border-radius: 10px;
    }

    .veg-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #E8F5E9;
      color: #128C33;
      padding: 8px 20px;
      border-radius: 50px;
      font-weight: 700;
      letter-spacing: 1px;
      border: 1px solid #C8E6C9;
    }

    .veg-dot {
      width: 12px;
      height: 12px;
      background: #128C33;
      border-radius: 50%;
      border: 2px solid white;
      box-shadow: 0 0 0 1px #128C33;
    }
    
    @media print {
      @page {
        margin: 0;
      }
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
        color-adjust: exact !important;
      }
      body {
        background-color: white !important;
        align-items: flex-start !important;
        padding-top: 50px !important;
      }
      .qr-card {
        margin: 0 auto !important;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1) !important;
        border: 1px solid rgba(0,0,0,0.1) !important;
        border-radius: 24px !important;
        overflow: hidden !important;
        max-width: 450px !important;
      }
      .qr-header {
        background: linear-gradient(135deg, var(--primary-color), #5A0C0E) !important;
      }
    }
  </style>
</head>
<body>

  <div class="qr-card">
    <div class="qr-header">
      <h1>Patel's Cafe</h1>
      <p>Premium Quality</p>
    </div>
    
    <div class="qr-body">
      <div class="instruction">Scan For Digital Menu</div>
      
      <div class="qr-code-wrapper">
        <!-- Assuming the QR code is in the same folder -->
        <img src="Menu_QRCode.png" alt="Patel's Cafe Menu QR Code">
      </div>
      
      <div>
        <div class="veg-badge">
          <div class="veg-dot"></div>
          100% PURE VEG
        </div>
      </div>
    </div>
  </div>

</body>
</html>
